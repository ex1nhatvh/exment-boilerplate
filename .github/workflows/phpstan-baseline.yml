name: phpstan-baseline

on:
  workflow_dispatch:
    inputs:
      exment_ref:
        description: exment ref to baseline
        required: false
        default: feature/laravel-12
      exment_admin_core_ref:
        description: exment-admin-core ref
        required: false
        default: master

env:
  EXMENT_REPOSITORY: exceedone/exment
  EXMENT_ADMIN_CORE_REPOSITORY: exceedone/exment-admin-core

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EXMENT_REPOSITORY }}
          ref: ${{ github.event.inputs.exment_ref }}
          path: ./exment

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EXMENT_ADMIN_CORE_REPOSITORY }}
          ref: ${{ github.event.inputs.exment_admin_core_ref }}
          path: ./exment-admin-core

      - name: Link this repository into docker-exment as exment-boilerplate
        run: ln -s .. docker-exment/exment-boilerplate

      - name: Docker Compose Version
        run: docker compose --version

      - name: Make mysql up
        working-directory: docker-exment
        run: |
          make mysql-up

      - name: copy compose.dev.json
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php cp composer.dev.json composer.json
          docker compose -f docker-compose.yml exec -T php cp composer.dev.lock composer.lock

      - name: Ensure safe git directory
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php git config --global --add safe.directory '*'

      - name: Make mysql init
        working-directory: docker-exment
        run: |
          make mysql-init

      # Config lấy từ chính exment đang test; baseline cũ phải rỗng khi generate,
      # nếu không lỗi cũ bị chính nó nuốt và baseline sinh ra sẽ thiếu.
      - name: setup phpstan (empty baseline)
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php cp vendor/exceedone/exment/phpstan.neon.dist .
          docker compose -f docker-compose.yml exec -T php sed -i 's|vendor/nunomaduro/larastan|vendor/larastan/larastan|g' phpstan.neon.dist
          docker compose -f docker-compose.yml exec -T php sh -c "printf 'parameters:\n\tignoreErrors: []\n' > phpstan-baseline.neon"
          docker compose -f docker-compose.yml exec -T php sh -c \
            "grep -q phpstan-baseline.neon phpstan.neon.dist || sed -i '1a\\    - phpstan-baseline.neon' phpstan.neon.dist"

      - name: generate phpstan baseline
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php ./vendor/bin/phpstan analyse \
            --generate-baseline phpstan-baseline.neon \
            --allow-empty-baseline \
            --memory-limit=1G

      - name: extract baseline from container
        run: |
          (cd docker-exment && docker compose -f docker-compose.yml exec -T php cat phpstan-baseline.neon) > /tmp/phpstan-baseline.neon
          echo "--- baseline head ---"
          head -n 40 /tmp/phpstan-baseline.neon
          echo "--- baseline size ---"
          wc -l /tmp/phpstan-baseline.neon

      - name: upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: phpstan-baseline
          path: /tmp/phpstan-baseline.neon
          if-no-files-found: error
          retention-days: 7
