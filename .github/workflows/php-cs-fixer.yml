name: php-cs-fixer

on:
  push:
  workflow_dispatch:

env:
  EXMENT_REPOSITORY: exceedone/exment
  EXMENT_REF: master

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EXMENT_REPOSITORY }}
          ref: ${{ env.EXMENT_REF }}
          path: ./exment

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Prepare
        run: |
          wget https://cs.symfony.com/download/php-cs-fixer-v3.phar -O php-cs-fixer
          chmod a+x php-cs-fixer

      - name: Versions
        run: |
          cat /etc/os-release
          php -v
          php php-cs-fixer --version

      - name: Execute php-cs-fixer
        working-directory: exment
        run: |
          php ../php-cs-fixer fix --dry-run -v --diff ./src
          php ../php-cs-fixer fix --dry-run -v --diff ./tests
